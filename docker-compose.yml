services:

  frontend:
    build: ./frontend
    container_name: frontend-prod
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    networks:
      - frontend

  backend:
    build: ./backend
    container_name: backend-prod
    env_file:
      - ./backend/.env
    depends_on:
      - mysql
    networks:
      - backend

  mysql:
    image: mysql:8
    container_name: EStoreDB
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend

  nginx:
    image: nginx:alpine
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "80:80"
    depends_on:
      - frontend
    networks:
      - frontend
      - backend

volumes:
  mysql_data:


networks:
  frontend:
  backend: