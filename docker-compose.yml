services:
  frontend:
    build: ./frontend
    container_name: frontend
    env_file:
      - ./frontend/.env
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - ./frontend/.env:/app/.env
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - frontend

  backend:
    build: ./backend
    container_name: backend
    env_file:
      - ./backend/.env
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      - ./backend/.env:/app/.env 
    ports:
      - "2000:2000"

    networks:
      - backend

volumes:
  frontend_node_modules:
  backend_node_modules:

networks:
  frontend:
  backend: